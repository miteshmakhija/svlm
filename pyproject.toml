[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svlm-catalogue"
version = "0.1.0"
description = "Distillation pipeline for the MSCI small vertical language model catalogue"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "numpy"]

[tool.setuptools.packages.find]
include = ["svlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
